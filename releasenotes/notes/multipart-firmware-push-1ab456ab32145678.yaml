---
features:
  - |
    Adds ``UpdateService.multipart_update`` for streaming Redfish multipart
    HTTP push firmware updates, including explicit targets, OEM parameters,
    operation apply time and force-update policy. Uploads use the authenticated
    connector and replay the complete image after BMC retries, session refresh
    or a connect timeout. After any other connection error the image is not
    sent again, since the BMC may have received it.
